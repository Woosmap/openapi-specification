title: AssetOpenResponse
type: object
description: The Current opening status for an Asset
required:
  - open_now
  - open_hours
  - week_day
properties:
  current_slice:
    $ref: "./AssetOpeningHoursPeriod.yml"
  open_hours:
    description: the opening hours for the day
    type: array
    items:
      $ref: "./AssetOpeningHoursPeriod.yml"
  open_now:
    description: Boolean value indicating the status of the opening hours
    type: boolean
  next_opening:
    description: the next opening hours period, returned when the asset is closed. `null` when the asset does not open in the next days.
    type: [object, "null"]
    required:
      - day
    properties:
      end:
        description: the hours of next closing
        type: string
        example: "17:30"
      start:
        description: the hours of next opening
        type: string
        example: "06:00"
      all-day:
        description: true when the asset is open all day, in place of `start` and `end`
        type: boolean
      day:
        type: string
        description: the day of next opening
        example: "2021-11-16"
  week_day:
    description: the day of the week starting from 1 to 7
    type: integer
    minimum: 1
    maximum: 7
example: {
  "open_now": true,
  "open_hours": [ { "end": "20:00", "start": "05:00" } ],
  "week_day": 1,
  "current_slice": { "end": "20:00", "start": "05:00" },
}
