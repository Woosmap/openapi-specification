title: Pagination
type: object
description: Pagination to reach all returned assets. max 300 assets par page.
required:
  - page
  - pageCount
  - hasNext
properties:
  page:
    type: integer
    description: the request page
    example: 1
  pageCount:
    type: integer
    deprecated: true
    description: >
      Deprecated, use `hasNext` instead. The number of available pages.
      When the request is `enhanced`, this is not a total: it is `page + 1` if more assets are available, otherwise `page`.
    example: 10
  hasNext:
    type: boolean
    description: whether a next page of assets is available
    example: true
