apis:
  toValidate:
    root: ../merged-woosmap-openapi3.json
extends:
  - recommended
plugins:
  - ./plugins.js
rules:
  tag-description: warn
  no-path-trailing-slash: off
  # redocly v2's "recommended" set promotes these to error; keep them warnings
  # to preserve prior behavior. Revisit by fixing the offending example data
  # (no-invalid-schema-examples) and adding servers (no-empty-servers).
  no-invalid-schema-examples: warn
  no-empty-servers: warn
  woosmap/validate-tags:
    severity: error
    requireOperationTags: true
    expectedNames:
      - "Store Search"
      - "Data Management"
      - "Zones"
      - "Geolocation API"
      - "Localities API"
      - "Woosmap for what3words API"
      - "Indoor API"
      - "Transit API"
      - "Datasets API"
      - "Static Map API"
      - "Distance API"