# Configuration for inject-code-samples decorator
# This file contains mappings between external API operation IDs and local code samples/examples
#
# Each mapping can include:
#   - regionTag: identifier from requests.ts for code sample generation
#   - snippetPath: directory containing generated code snippets
#   - requestPath: path to request body example file (for POST/PUT operations)
#   - responsePath: path to a single response example file (injected under
#     the `custom` key)
#   - responseExamples: list of named response examples; each item has
#     `name`, `summary`, `path`, and optionally `responseCode`. Use this
#     when an operation needs multiple distinct examples (e.g. Address +
#     PostalCode for /localities/details).
#   - responseCode: HTTP status code for response (default: '200')

mappings:
  # Distance Matrix - GET
  matrix_distance_distancematrix_json__get:
    regionTag: woosmap_http_distance_matrix
    snippetPath: specification/snippets
    responsePath: specification/responses/woosmap_http_distance_matrix_response.yml
  
  # Distance Matrix - POST
  matrix_post_distance_distancematrix_json__post:
    regionTag: woosmap_http_distance_matrix_request
    snippetPath: specification/snippets
    requestPath: specification/requests/woosmap_http_distance_matrix_request.yml
    responsePath: specification/responses/woosmap_http_distance_matrix_request_response.yml
  
  # Distance Route
  route_distance_route_json__get:
    regionTag: woosmap_http_distance_route
    snippetPath: specification/snippets
    responsePath: specification/responses/woosmap_http_distance_route_response.yml
  
  # Distance Tolls
  tolls_distance_tolls_json__get:
    regionTag: woosmap_http_distance_tolls
    snippetPath: specification/snippets
    responsePath: specification/responses/woosmap_http_distance_tolls_response.yml
  
  # Distance Isochrone - GET
  isochrone_distance_isochrone_json__get:
    regionTag: woosmap_http_distance_isochrone
    snippetPath: specification/snippets
    responsePath: specification/responses/woosmap_http_distance_isochrone_response.yml
  
  # Distance Isochrone - POST
  isochrone_post_distance_isochrone_json__post:
    regionTag: woosmap_http_distance_isochrone
    snippetPath: specification/snippets
    responsePath: specification/responses/woosmap_http_distance_isochrone_response.yml

  # Distance Matrix Async - Start (POST)
  start_async_matrix_distance_matrix_async__post:
    regionTag: woosmap_http_distance_matrix_async
    snippetPath: specification/snippets
    requestPath: specification/requests/woosmap_http_distance_matrix_async_request.yml
    responsePath: specification/responses/woosmap_http_distance_matrix_async_response.yml
  
  # Distance Matrix Async - Get Result
  async_matrix_distance_matrix_async__matrix_id__get:
    responseCode: "303"
    regionTag: woosmap_http_distance_matrix_async_result
    snippetPath: specification/snippets
    responsePath: specification/responses/woosmap_http_distance_matrix_async_result_response.yml
  
  # Distance Matrix Async - Get Status
  async_matrix_status_distance_matrix_async__matrix_id__status_get:
    regionTag: woosmap_http_distance_matrix_async_status
    snippetPath: specification/snippets
    responsePath: specification/responses/woosmap_http_distance_matrix_async_status_response.yml

  # Static Map
  get_static_map_maps_static_get:
    regionTag: woosmap_http_maps_static
    snippetPath: specification/snippets

  # DATASETS API
  # List Datasets
  list_datasets_datasets__get:
    regionTag: woosmap_http_datasets_list
    snippetPath: specification/snippets

  # Create Dataset
  create_dataset_datasets__post:
    regionTag: woosmap_http_datasets_create
    snippetPath: specification/snippets

  # Get Dataset
  get_dataset_datasets__dataset_id__get:
    regionTag: woosmap_http_datasets_get
    snippetPath: specification/snippets

  # Update Dataset
  update_dataset_datasets__dataset_id__put:
    regionTag: woosmap_http_datasets_update
    snippetPath: specification/snippets

  # Delete Dataset
  delete_dataset_datasets__dataset_id__delete:
    regionTag: woosmap_http_datasets_delete
    snippetPath: specification/snippets

  # Get Dataset Status
  get_dataset_status_datasets__dataset_id__status_get:
    regionTag: woosmap_http_datasets_status
    snippetPath: specification/snippets

  # Trigger Import
  trigger_import_datasets__dataset_id__import_post:
    responseCode: "202"
    regionTag: woosmap_http_datasets_import
    snippetPath: specification/snippets

  # Reimport Webhook
  reimport_dataset_webhook_datasets_hooks_reimport__reimport_key__post:
    responseCode: "202"
    regionTag: woosmap_http_datasets_reimport_webhook
    snippetPath: specification/snippets

  # Search Features
  search_features_datasets__dataset_id__features_search__post:
    regionTag: woosmap_http_datasets_search_features
    snippetPath: specification/snippets

  # Nearby Features
  nearby_features_datasets__dataset_id__features_nearby__post:
    regionTag: woosmap_http_datasets_nearby_features
    snippetPath: specification/snippets

  # Intersect Features
  intersect_features_datasets__dataset_id__features_intersects__post:
    regionTag: woosmap_http_datasets_intersect_features
    snippetPath: specification/snippets

  # Contains Features
  contains_features_datasets__dataset_id__features_contains__post:
    regionTag: woosmap_http_datasets_contains_features
    snippetPath: specification/snippets

  # Within Features
  within_features_datasets__dataset_id__features_within__post:
    regionTag: woosmap_http_datasets_within_features
    snippetPath: specification/snippets

  # Get Feature
  get_feature_datasets__dataset_id__features__feature_id__get:
    regionTag: woosmap_http_datasets_get_feature
    snippetPath: specification/snippets

  # LOCALITIES API
  # Autocomplete
  autocomplete_localities_autocomplete_get:
    regionTag: woosmap_http_localities_autocomplete_collection
    snippetPath: specification/snippets
    responsePath: specification/responses/woosmap_http_localities_autocomplete_collection_response.yml

  # Details — two named examples (Address + PostalCode).
  details_localities_details_get:
    regionTag: woosmap_http_localities_details_address
    snippetPath: specification/snippets
    responseExamples:
      - name: Address
        summary: Localities Address details from a `public_id` retrieved using Localities autocomplete
        path: specification/responses/woosmap_http_localities_details_address_response.yml
      - name: PostalCode
        summary: Localities Postal Code details from a `public_id` retrieved using Localities autocomplete
        path: specification/responses/woosmap_http_localities_details_postal_code_response.yml

  # Geocode — two named examples (forward geocode + reverse geocode).
  geocode_localities_geocode_get:
    regionTag: woosmap_http_localities_geocode_collection
    snippetPath: specification/snippets
    responseExamples:
      - name: geocode
        summary: Geocode Results for address `Place Jeanne-d'Arc` with components `country:FR`
        path: specification/responses/woosmap_http_localities_geocode_collection_response.yml
      - name: reverse
        summary: Reverse Geocode Results for latlng `51.52089223979333, -0.195460973340401` with list_sub_buildings `true`
        path: specification/responses/woosmap_http_localities_reverse_geocode_collection_response.yml

  # Nearby POIs
  poi_nearby_localities_nearby_get:
    regionTag: woosmap_http_localities_nearby_collection
    snippetPath: specification/snippets
    responsePath: specification/responses/woosmap_http_localities_nearby_collection_response.yml

