name: Build and Test
on:
  - push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 9.15.9
      - name: Install dependencies
        run: pnpm i --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test