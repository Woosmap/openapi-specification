name: Update dist
on:
  repository_dispatch:
    types: [update-dist-command]
jobs:
  update-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.WOOSMAP_GH_ACCESS_TOKEN }}
          repository: ${{ github.event.client_payload.pull_request.head.repo.full_name }}
          ref: ${{ github.event.client_payload.pull_request.head.ref }}
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 9.15.9
      - name: Install dependencies
        run: pnpm i --frozen-lockfile
      - name: Update dist
        run: |
          pnpm run build
          git config --global user.name 'gaelsimon'
          git config --global user.email 'gael.simon@woosmap.com'
          git add dist
          git commit -m "chore: update dist folder [skip ci]" || true
          git push origin
      - name: Add reaction
        uses: peter-evans/create-or-update-comment@v5.0.0
        with:
          token: ${{ secrets.WOOSMAP_GH_ACCESS_TOKEN }}
          repository: ${{ github.event.client_payload.github.payload.repository.full_name }}
          comment-id: ${{ github.event.client_payload.github.payload.comment.id }}
          reaction-type: rocket
